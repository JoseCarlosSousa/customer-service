server:
  port: ${PORT:8084}
  address: 0.0.0.0
  error:
    include-message: always

spring:
  application:
    name: customer-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql.railway.internal:3306/railway?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:-root}
    password: ${SPRING_DATASOURCE_PASSWORD:-nndUUxNGOeRMPotrdJZSsunpIZcKkjSP}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

